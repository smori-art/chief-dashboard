# ============================================================
# Column Mappings: Excel source columns -> BigQuery target columns
# For each source type, define:
#   - target_table: BQ raw table name
#   - columns: mapping of BQ column -> list of possible Excel column names
#   - required: list of required BQ columns
#   - date_columns: columns to parse as dates
#   - numeric_columns: columns to parse as numeric
# ============================================================

